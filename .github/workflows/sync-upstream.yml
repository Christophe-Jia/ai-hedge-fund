name: Sync Upstream (mirror branch only)

# IMPORTANT (changed 2026-09-16): this workflow used to merge upstream into
# `main`. Upstream reorganised into the `hedge_fund/` package (2.0), which
# silently deleted/renamed directories that this fork's own platform code
# lives in (src/data, src/signals, src/validation, ...). The merge then
# destroyed the working tree of the fork's main line.
#
# It now syncs upstream into the dedicated `upstream-mirror` branch, so
# upstream changes stay available for reference/browsing but can never
# auto-restructure `main` again. To adopt something from upstream, diff it
# against `upstream-mirror` and cherry-pick deliberately.

on:
  schedule:
    # Every 4 hours
    - cron: "0 */4 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror branch
        uses: actions/checkout@v4
        with:
          ref: upstream-mirror
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/virattt/ai-hedge-fund.git || true
          git fetch upstream

      - name: Merge upstream main into mirror
        run: |
          # Mirror branch: take upstream wholesale. Conflicts are resolved in
          # upstream's favour because this branch exists only to track it.
          git merge upstream/main --no-edit -X theirs \
            || {
              echo "Merge conflict detected — resolving with upstream ('theirs')"
              git checkout --theirs .
              git add -A
              git commit --no-edit
            }

      - name: Push mirror branch (never main)
        run: |
          git push origin upstream-mirror
