[tool.poetry]
name = "hedge-fund"
version = "2.1.0"
description = "An AI-powered hedge fund: LLM investor agents and quant alpha models you can build, backtest, and run from your terminal"
authors = ["Virat Singh <virat.dot@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/virattt/ai-hedge-fund"
repository = "https://github.com/virattt/ai-hedge-fund"
keywords = ["ai", "hedge-fund", "trading", "llm", "backtesting", "agents"]
packages = [
    { include = "hedge_fund", from = "." }
]
exclude = [
    "hedge_fund/**/test_*.py",
    "hedge_fund/conftest.py",
]

[tool.poetry.dependencies]
python = "^3.11"
langchain-anthropic = "0.3.5"
langchain-openai = "^0.3.5"
langchain-deepseek = "^0.1.2"
langchain-google-genai = "^2.0.11"
langchain-xai = "^0.2.5"
pandas = "^2.1.0"
numpy = "^1.24.0"
python-dotenv = "1.0.0"
matplotlib = "^3.9.2"
requests = "^2.32.0"
rich = "^14.2.0"
pydantic = "^2.4.2"
httpx = "^0.27.0"
sqlalchemy = "^2.0.22"
alembic = "^1.12.0"
langchain-gigachat = "^0.3.12"
langchain-xai = "^0.2.5"
# Crypto trading
ccxt = "^4.0.0"
# US stock live trading
alpaca-py = "^0.36.0"
# Social media data
praw = "^7.7.0"
# Telegram integration
python-telegram-bot = {version = "^21.0", extras = ["job-queue"]}
# NLP / sentiment analysis
transformers = "^4.37.0"
torch = "^2.1.0"
# Task scheduling
schedule = "^1.2.0"

[tool.poetry.scripts]
aihf = "hedge_fund.run:main"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
yfinance = "^1.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-m 'not network'"
markers = [
    "network: marks tests that require live network access (run with '-m network' to include)",
]

[tool.black]
line-length = 420
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
force_alphabetical_sort_within_sections = true

[tool.poetry.scripts]
backtester = "src.backtesting.cli:main"
live-trading = "src.cli.live_trading:main"